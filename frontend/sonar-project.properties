sonar.projectKey=cga-frontend
sonar.projectName=Clínica Guizada Aliaga - Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/.angular/**
sonar.javascript.lcov.reportPaths=coverage/Clinica_Guizada_Aliaga_Frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/Clinica_Guizada_Aliaga_Frontend/lcov.info
sonar.sourceEncoding=UTF-8
# Solo el arranque de la app (cableado sin lógica), decidido en CLI-121: sigue
# analizándose para issues, pero no cuenta para coverage.
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,**/*.routes.ts,src/environments/**
