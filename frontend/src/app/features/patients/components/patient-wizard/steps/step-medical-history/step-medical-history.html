<form class="step-form" (ngSubmit)="onSubmit()" novalidate>
  <div class="step-form__section">
    <h3 class="step-form__section-title">Enfermedades y condiciones</h3>
    <div class="step-form__checkgrid">
      <label class="step-form__check">
        <input type="checkbox" [checked]="hasAllergies()" (change)="hasAllergies.set($any($event.target).checked)" />
        <span>Alergias</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="kidneyProblems()" (change)="kidneyProblems.set($any($event.target).checked)" />
        <span>Problemas renales</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="ulcers()" (change)="ulcers.set($any($event.target).checked)" />
        <span>Úlceras</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="rheumatism()" (change)="rheumatism.set($any($event.target).checked)" />
        <span>Reumatismo</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="heartProblems()" (change)="heartProblems.set($any($event.target).checked)" />
        <span>Problemas cardíacos</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="diabetes()" (change)="diabetes.set($any($event.target).checked)" />
        <span>Diabetes</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="hypertension()" (change)="hypertension.set($any($event.target).checked)" />
        <span>Hipertensión</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="hemorrhages()" (change)="hemorrhages.set($any($event.target).checked)" />
        <span>Hemorragias</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="anemia()" (change)="anemia.set($any($event.target).checked)" />
        <span>Anemia</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="sti()" (change)="sti.set($any($event.target).checked)" />
        <span>ITS</span>
      </label>
    </div>
  </div>

  <div class="step-form__section">
    <h3 class="step-form__section-title">Información adicional</h3>
    <div class="step-form__grid step-form__grid--2">
      <div class="step-form__field">
        <label class="step-form__label" for="otherDiseases">Otras enfermedades</label>
        <textarea
          id="otherDiseases"
          class="step-form__input step-form__input--textarea"
          [class.step-form__input--invalid]="otherDiseases.showError()"
          [value]="otherDiseases.value()"
          (input)="otherDiseases.set($any($event.target).value)"
          (blur)="otherDiseases.markTouched()"
          maxlength="1000"
          placeholder="Describe otras enfermedades relevantes..."
          rows="3"
          [attr.aria-invalid]="otherDiseases.showError() || null"
          [attr.aria-describedby]="otherDiseases.showError() ? 'otherDiseases-err' : null"
        ></textarea>
        @if (otherDiseases.showError()) {
          <p class="step-form__field-error" id="otherDiseases-err" role="alert">{{ otherDiseases.error() }}</p>
        }
      </div>
      <div class="step-form__field">
        <label class="step-form__label" for="currentMedications">Medicamentos actuales</label>
        <textarea
          id="currentMedications"
          class="step-form__input step-form__input--textarea"
          [class.step-form__input--invalid]="currentMedications.showError()"
          [value]="currentMedications.value()"
          (input)="currentMedications.set($any($event.target).value)"
          (blur)="currentMedications.markTouched()"
          maxlength="1000"
          placeholder="Lista los medicamentos que toma actualmente..."
          rows="3"
          [attr.aria-invalid]="currentMedications.showError() || null"
          [attr.aria-describedby]="currentMedications.showError() ? 'currentMedications-err' : null"
        ></textarea>
        @if (currentMedications.showError()) {
          <p class="step-form__field-error" id="currentMedications-err" role="alert">{{ currentMedications.error() }}</p>
        }
      </div>
      <div class="step-form__field">
        <label class="step-form__label" for="gestationPeriod">Período de gestación</label>
        <input
          id="gestationPeriod"
          class="step-form__input"
          [class.step-form__input--invalid]="gestationPeriod.showError()"
          type="text"
          [value]="gestationPeriod.value()"
          (input)="gestationPeriod.set($any($event.target).value)"
          (blur)="gestationPeriod.markTouched()"
          maxlength="100"
          placeholder="Ej: 20 semanas / No aplica"
          [attr.aria-invalid]="gestationPeriod.showError() || null"
          [attr.aria-describedby]="gestationPeriod.showError() ? 'gestationPeriod-err' : null"
        />
        @if (gestationPeriod.showError()) {
          <p class="step-form__field-error" id="gestationPeriod-err" role="alert">{{ gestationPeriod.error() }}</p>
        }
      </div>
      <div class="step-form__field">
        <label class="step-form__label">¿Reacciones a la anestesia?</label>
        <div class="step-form__radio-row">
          <label class="step-form__radio">
            <input type="radio" name="anesthesia" [checked]="anesthesiaReactions() === true" (change)="anesthesiaReactions.set(true)" />
            Sí
          </label>
          <label class="step-form__radio">
            <input type="radio" name="anesthesia" [checked]="anesthesiaReactions() === false" (change)="anesthesiaReactions.set(false)" />
            No
          </label>
          <label class="step-form__radio">
            <input type="radio" name="anesthesia" [checked]="anesthesiaReactions() === null" (change)="anesthesiaReactions.set(null)" />
            No sabe
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="step-form__actions">
    <button class="step-form__btn step-form__btn--secondary" type="button" [disabled]="loading()" (click)="onBack()">
      <span class="material-symbols-outlined">arrow_back</span>
      Anterior
    </button>
    <button class="step-form__btn step-form__btn--primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="step-form__spinner"></span>
        Guardando...
      } @else {
        Siguiente
        <span class="material-symbols-outlined">arrow_forward</span>
      }
    </button>
  </div>
</form>
