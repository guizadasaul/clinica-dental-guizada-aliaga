<form class="step-form" (ngSubmit)="onSubmit()" novalidate>
  <div class="step-form__section">
    <h3 class="step-form__section-title">Hábitos de higiene bucal</h3>
    <div class="step-form__checkgrid">
      <label class="step-form__check">
        <input type="checkbox" [checked]="usesToothbrush()" (change)="onUsesToothbrushChange($any($event.target).checked)" />
        <span>Usa cepillo dental</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="usesDentalFloss()" (change)="usesDentalFloss.set($any($event.target).checked)" />
        <span>Usa hilo dental</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="usesToothpick()" (change)="usesToothpick.set($any($event.target).checked)" />
        <span>Usa palillo</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="brushesTongue()" (change)="brushesTongue.set($any($event.target).checked)" />
        <span>Cepilla la lengua</span>
      </label>
      <label class="step-form__check">
        <input type="checkbox" [checked]="usesMouthwash()" (change)="usesMouthwash.set($any($event.target).checked)" />
        <span>Usa enjuague bucal</span>
      </label>
    </div>

    @if (usesToothbrush()) {
      <div class="step-form__field" style="margin-top: 1rem; max-width: 320px;">
        <label class="step-form__label" for="brushingFrequency">Frecuencia de cepillado <span class="step-form__req">*</span></label>
        <select
          id="brushingFrequency"
          class="step-form__input"
          [class.step-form__input--invalid]="brushingFrequency.showError()"
          [value]="brushingFrequency.value()"
          (change)="brushingFrequency.set($any($event.target).value)"
          (blur)="brushingFrequency.markTouched()"
          [attr.aria-invalid]="brushingFrequency.showError() || null"
          [attr.aria-describedby]="brushingFrequency.showError() ? 'brushingFrequency-err' : null"
        >
          <option value="">Seleccionar</option>
          @for (opt of brushingFrequencyOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
        @if (brushingFrequency.showError()) {
          <p class="step-form__field-error" id="brushingFrequency-err" role="alert">{{ brushingFrequency.error() }}</p>
        }
      </div>
    }
  </div>

  <div class="step-form__actions">
    <button class="step-form__btn step-form__btn--secondary" type="button" [disabled]="loading()" (click)="onBack()">
      <span class="material-symbols-outlined">arrow_back</span>
      Anterior
    </button>
    <button class="step-form__btn step-form__btn--primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="step-form__spinner"></span>
        Guardando...
      } @else {
        Siguiente
        <span class="material-symbols-outlined">arrow_forward</span>
      }
    </button>
  </div>
</form>
