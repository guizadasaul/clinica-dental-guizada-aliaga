@if (activeNav() === 'home') {
  <div class="admin">
    <!-- Header -->
    <header class="admin__header">
      <div class="admin__greeting">
        <p class="admin__date">{{ today() }}</p>
        <h1 class="admin__title">{{ greeting() }}, {{ firstName() }}</h1>
        <p class="admin__subtitle">Panel de administración de la clínica.</p>
      </div>
      <app-logo class="admin__header-deco" tone="light" />
    </header>

    <!-- Quick access -->
    <section class="admin__section">
      <h2 class="section-title">Accesos rápidos</h2>
      <div class="actions-grid">
        <button type="button" class="action-card action-card--primary" (click)="onGoTo('doctors')">
          <span class="material-symbols-outlined action-card__icon" aria-hidden="true">group</span>
          <p class="action-card__label">Doctores</p>
          <p class="action-card__desc">Alta y gestión de los doctores de la clínica</p>
          <span class="material-symbols-outlined action-card__arrow" aria-hidden="true">arrow_forward</span>
        </button>
        <button type="button" class="action-card action-card--tertiary" (click)="onGoTo('reports')">
          <span class="material-symbols-outlined action-card__icon" aria-hidden="true">bar_chart</span>
          <p class="action-card__label">Reportes</p>
          <p class="action-card__desc">Indicadores operativos y financieros</p>
          <span class="material-symbols-outlined action-card__arrow" aria-hidden="true">arrow_forward</span>
        </button>
      </div>
    </section>
  </div>
}

@if (activeNav() === 'doctors') {
  <div class="page"><app-admin-doctors /></div>
}

@if (activeNav() === 'reports') {
  <div class="page"><app-reports-page /></div>
}
