<form class="guest-contact" (ngSubmit)="onSubmit()" novalidate>
  <div class="guest-contact__field">
    <label class="guest-contact__label">
      {{ 'landing.booking.guestContact.firstNameLabel' | translate }} <span class="guest-contact__req">*</span>
    </label>
    <input
      id="guestFirstName"
      class="guest-contact__input"
      type="text"
      [value]="firstName()"
      (input)="firstName.set($any($event.target).value)"
      [placeholder]="'landing.booking.guestContact.firstNamePlaceholder' | translate"
      maxlength="100"
      required
    />
  </div>
  <div class="guest-contact__field">
    <label class="guest-contact__label">
      {{ 'landing.booking.guestContact.lastNamePaternalLabel' | translate }} <span class="guest-contact__req">*</span>
    </label>
    <input
      id="guestLastNamePaternal"
      class="guest-contact__input"
      type="text"
      [value]="lastNamePaternal()"
      (input)="lastNamePaternal.set($any($event.target).value)"
      [placeholder]="'landing.booking.guestContact.lastNamePaternalPlaceholder' | translate"
      maxlength="100"
      required
    />
  </div>
  <div class="guest-contact__field">
    <label class="guest-contact__label">
      {{ 'landing.booking.guestContact.lastNameMaternalLabel' | translate }}
      <span class="guest-contact__optional">{{ 'landing.booking.guestContact.lastNameMaternalOptional' | translate }}</span>
    </label>
    <input
      id="guestLastNameMaternal"
      class="guest-contact__input"
      type="text"
      [value]="lastNameMaternal()"
      (input)="lastNameMaternal.set($any($event.target).value)"
      [placeholder]="'landing.booking.guestContact.lastNameMaternalPlaceholder' | translate"
      maxlength="100"
    />
  </div>
  <div class="guest-contact__field">
    <label class="guest-contact__label">
      {{ 'landing.booking.guestContact.phoneLabel' | translate }} <span class="guest-contact__req">*</span>
    </label>
    <app-phone-input [disabled]="loading()" (changed)="onPhoneChanged($event)" />
  </div>
  <div class="guest-contact__field">
    <label class="guest-contact__label">
      {{ 'landing.booking.guestContact.emailLabel' | translate }}
      <span class="guest-contact__optional">{{ 'landing.booking.guestContact.emailOptional' | translate }}</span>
    </label>
    <input
      class="guest-contact__input"
      type="email"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      [placeholder]="'landing.booking.guestContact.emailPlaceholder' | translate"
      maxlength="255"
    />
  </div>

  @if (formError()) {
    <p class="guest-contact__error">{{ formError() }}</p>
  }

  <div class="guest-contact__actions">
    <button class="guest-contact__btn" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="guest-contact__spinner"></span>
        {{ 'landing.booking.guestContact.submitting' | translate }}
      } @else {
        {{ 'landing.booking.guestContact.submit' | translate }}
        <span class="material-symbols-outlined">arrow_forward</span>
      }
    </button>
  </div>
</form>
