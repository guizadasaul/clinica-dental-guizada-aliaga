<div class="odontogram-chart" [class.odontogram-chart--readonly]="!interactive()">

  <!-- CLI-249: en el celular el dibujo no se achica hasta dientes de 16 px; se desliza de costado. -->
  <p class="odontogram-chart__swipe-hint">
    <span class="material-symbols-outlined" aria-hidden="true">swipe</span>
    Desliza de costado para ver todos los dientes.
  </p>
  <div class="odontogram-chart__scroll">
  <!-- Chart: static drawing + interactive overlay (618x554 grid) -->
  <fieldset class="odontogram-chart__canvas">
    <legend class="visually-hidden">Selector de dientes</legend>
    <img class="odontogram-chart__canvas-img" [src]="odontogramUrl" alt="Odontograma" />
    <svg
      class="odontogram-chart__canvas-overlay"
      viewBox="0 0 618 554"
      xmlns="http://www.w3.org/2000/svg"
    >
      <text class="odontogram-chart__arch-title-svg" x="309" y="16" text-anchor="middle">Arcada superior</text>
      <text class="odontogram-chart__arch-title-svg" x="309" y="550" text-anchor="middle">Arcada inferior</text>

      @for (tooth of cells; track tooth.number) {
        <g
          class="odontogram-chart__cell"
          [class.odontogram-chart__cell--selected]="isSelected(tooth.number)"
          (click)="onCellClick(tooth)"
          (keyup.enter)="onCellClick(tooth)"
          [attr.role]="interactive() ? 'button' : null"
          [attr.tabindex]="interactive() ? 0 : null"
          [attr.data-tooth]="tooth.number"
          [attr.aria-label]="cellLabel(tooth.number)"
        >
          <title>{{ cellLabel(tooth.number) }}</title>
          <!-- Invisible, generous click target -->
          <rect
            class="odontogram-chart__cell-hit"
            [attr.x]="tooth.x" [attr.y]="tooth.y" [attr.width]="tooth.w" [attr.height]="tooth.h"
          />
          <!-- Outline paths are grouped and the opacity is applied to the group, so overlapping
               objects flatten into a single surface (overlap paints the same, no doubling).
               The overlay multiplies with the drawing, so the paint never hides its lines. -->
          <g
            class="odontogram-chart__cell-paint"
            [class.odontogram-chart__cell-paint--diagnosed]="isDiagnosed(tooth.number)"
            [class.odontogram-chart__cell-paint--treated]="isTreated(tooth.number)"
            [class.odontogram-chart__cell-paint--selected]="isSelected(tooth.number)"
          >
            @for (outline of tooth.outlines; track $index) {
              <path
                class="odontogram-chart__cell-shape"
                [attr.d]="outline"
                [attr.fill]="paintFill(tooth.number)"
              />
            }
          </g>
          <text
            class="odontogram-chart__cell-num"
            [attr.x]="tooth.labelX" [attr.y]="tooth.labelY" [attr.font-size]="tooth.labelSize"
            text-anchor="middle"
          >{{ tooth.number }}</text>
          @if (extraCount(tooth.number) > 0) {
            <!-- CLI-179: el diente tiene más diagnósticos que el que da el color. -->
            <text
              class="odontogram-chart__cell-badge"
              [attr.x]="tooth.labelX + tooth.labelSize * 1.1"
              [attr.y]="tooth.labelY - tooth.labelSize * 0.55"
              [attr.font-size]="tooth.labelSize * 0.8"
              text-anchor="start"
            >+{{ extraCount(tooth.number) }}</text>
          }
        </g>
      }
    </svg>
  </fieldset>
  </div>

  <!-- Legend -->
  @if (legendItems().length > 0) {
    <div class="odontogram-chart__legend">
      @for (group of legendGroups(); track group.title) {
        <div class="odontogram-chart__legend-group">
          @if (group.title) {
            <span class="odontogram-chart__legend-title">{{ group.title }}</span>
          }
          <div class="odontogram-chart__legend-items">
            @for (item of group.items; track item.name) {
              <div class="odontogram-chart__legend-item">
                <span class="odontogram-chart__legend-dot" [style.background]="item.color"></span>
                <span>{{ item.name }}</span>
              </div>
            }
          </div>
        </div>
      }
    </div>
  }

</div>
