<div class="lang-switcher">
  <button
    class="lang-switcher__trigger"
    type="button"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="material-symbols-outlined lang-switcher__icon">language</span>
    <span class="lang-switcher__code">{{ getCurrent().code.toUpperCase() }}</span>
    <span class="material-symbols-outlined lang-switcher__chevron" [class.lang-switcher__chevron--open]="open()">
      expand_more
    </span>
  </button>

  @if (open()) {
    <ul class="lang-switcher__dropdown">
      @for (lang of languages; track lang.code) {
        <li>
          <button
            type="button"
            class="lang-switcher__option"
            [class.lang-switcher__option--active]="lang.code === currentLang()"
            [attr.aria-current]="lang.code === currentLang() ? 'true' : null"
            (click)="selectLang(lang.code)"
          >
            <span class="lang-switcher__flag" aria-hidden="true">{{ lang.flag }}</span>
            <span class="lang-switcher__label">{{ lang.label }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
