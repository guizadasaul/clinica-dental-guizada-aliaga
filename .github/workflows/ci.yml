name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: self-hosted
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: api
        run: npm ci
      - working-directory: api
        run: npx prisma generate
      - working-directory: api
        run: npm run test:cov
      - working-directory: api
        run: npm run sonar -- -Dsonar.qualitygate.wait=true

  frontend:
    runs-on: self-hosted
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:cov
      - working-directory: frontend
        run: npm run sonar -- -Dsonar.qualitygate.wait=true

  e2e:
    runs-on: self-hosted
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/cga_e2e_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Los runners self-hosted en macOS no soportan "services:" (containers
      # de servicio de GitHub Actions) — es una limitación documentada, solo
      # funciona en runners Linux. Por eso la Postgres efímera se levanta a
      # mano con docker run, en un puerto (5434) y nombre de contenedor
      # (con el run_id) que no chocan con el stack de dev persistente
      # (cga-db en 5433).
      - name: Levantar Postgres efímera para e2e
        run: |
          docker rm -f cga-e2e-db-${{ github.run_id }} 2>/dev/null || true
          docker run -d --name cga-e2e-db-${{ github.run_id }} \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=cga_e2e_ci \
            -p 5434:5432 postgres:16-alpine
          until docker exec cga-e2e-db-${{ github.run_id }} pg_isready -U postgres -d cga_e2e_ci; do sleep 1; done
      - working-directory: api
        run: npm ci
      - working-directory: api
        run: npx prisma generate
      - working-directory: api
        run: npx prisma migrate deploy
      - working-directory: api
        run: npm run test:e2e
      - name: Bajar Postgres efímera
        if: always()
        run: docker rm -f cga-e2e-db-${{ github.run_id }}
