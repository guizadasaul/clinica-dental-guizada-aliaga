name: DB migrate

# Aplica las migraciones Prisma y el seed de catálogos a la base de un
# ambiente remoto (el Postgres de su proyecto Supabase), y verifica el
# resultado. Se corre a mano (Actions → DB migrate → Run workflow) o lo llama
# el pipeline de deploy. Nunca corre nada destructivo: solo `migrate deploy`
# (aplica lo pendiente, no borra) y seeds idempotentes.
#
# La connection string sale del secret DATABASE_URL del GitHub Environment
# del ambiente: el Session pooler de Supabase tal cual lo muestra el
# Dashboard (Connect → Session pooler), sin parámetros — este workflow le
# agrega los de TLS.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, production]
        required: true
      seed_demo:
        description: Sembrar además los usuarios de demo (solo staging)
        type: boolean
        default: false
      seed_catalogs:
        description: Correr el seed de catálogos (idempotente)
        type: boolean
        default: true
      # Solo a mano: no existe en workflow_call, así que ningún deploy lo
      # corre. Borra y recrea los datos de muestra (@muestra.example.com).
      seed_sample_data:
        description: Recargar los datos de muestra — pacientes, citas, presupuestos (solo staging)
        type: boolean
        default: false
      # Solo a mano (CLI-227): vincula los tratamientos ya registrados con su
      # línea del presupuesto y suma los que no estaban. Sin backfill_apply es
      # un dry-run que solo informa cuánto sube la deuda de cada paciente.
      backfill_quote_procedures:
        description: Vincular los tratamientos registrados con su presupuesto (CLI-227)
        type: boolean
        default: false
      # Solo a mano (CLI-257): las reservas web ya pagadas suman su consulta
      # pagada al presupuesto del paciente. Usa el mismo backfill_apply.
      backfill_web_consultations:
        description: Sumar al presupuesto las consultas web ya pagadas (CLI-257)
        type: boolean
        default: false
      backfill_apply:
        description: Aplicar el backfill (si no, solo dry-run)
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      seed_demo:
        type: boolean
        default: false
      # El deploy de producción no siembra: el seed de catálogos se corre a
      # mano allá (hace deleteMany de las sugerencias diagnóstico→tratamiento).
      seed_catalogs:
        type: boolean
        default: true
      # Commit exacto a migrar (el pipeline de deploy pasa el mismo que
      # construyó en la imagen). Vacío: el commit que disparó el workflow.
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Los secrets salen del Environment: staging y producción no comparten
    # ninguno, y producción puede exigir aprobación manual antes de correr.
    environment: ${{ inputs.environment }}
    env:
      APP_ENV: ${{ inputs.environment }}
      # CA raíz de Supabase (pública, versionada en api/certs/): la conexión
      # va por TLS y verifica el certificado del pooler.
      DATABASE_SSL_CA: ${{ github.workspace }}/api/certs/supabase-root-2021.crt
    defaults:
      run:
        working-directory: api
    steps:
      - name: Validar entradas
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_DEMO: ${{ inputs.seed_demo }}
          SEED_SAMPLE: ${{ inputs.seed_sample_data }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL en el Environment '$APP_ENV'"
            exit 1
          fi
          case "$DATABASE_URL" in
            *\?*)
              echo "::error::DATABASE_URL no debe traer parámetros (?...): este workflow agrega los de TLS"
              exit 1
              ;;
          esac
          if [ "$SEED_DEMO" = "true" ] && [ "$APP_ENV" = "production" ]; then
            echo "::error::Los usuarios de demo nunca se siembran en producción"
            exit 1
          fi
          if [ "$SEED_SAMPLE" = "true" ] && [ "$APP_ENV" != "staging" ]; then
            echo "::error::Los datos de muestra solo se cargan en staging"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # El motor de migraciones de Prisma no es node-pg: no lee
      # DATABASE_SSL_CA, se configura por la URL. `sslcert` + `sslaccept=strict`
      # es la combinación que verifica de verdad contra la CA (sslrootcert y
      # verify-full se ignoran y aceptan cualquier certificado).
      - name: Aplicar migraciones pendientes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}?sslmode=require&sslcert=${{ github.workspace }}/api/certs/supabase-root-2021.crt&sslaccept=strict
        run: npx prisma migrate deploy

      - name: Seed de catálogos (idempotente)
        if: inputs.seed_catalogs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db seed

      - name: Usuarios de demo
        if: inputs.seed_demo && inputs.environment == 'staging'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed:demo

      # Después de los demo: Pavel (doctor de demo) es uno de los 3 doctores.
      - name: Datos de muestra
        if: inputs.seed_sample_data && inputs.environment == 'staging'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed:sample

      - name: Backfill de tratamientos y presupuestos (CLI-227)
        if: inputs.backfill_quote_procedures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_FLAG: ${{ inputs.backfill_apply && '--apply' || '' }}
        run: npx ts-node prisma/backfill-quote-procedures.ts $BACKFILL_FLAG

      - name: Backfill de consultas web pagadas (CLI-257)
        if: inputs.backfill_web_consultations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_FLAG: ${{ inputs.backfill_apply && '--apply' || '' }}
        run: npx ts-node prisma/backfill-web-consultations.ts $BACKFILL_FLAG

      - name: Verificar la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx ts-node prisma/verify-db.ts
