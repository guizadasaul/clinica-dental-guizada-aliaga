services:
  db:
    image: postgres:16-alpine
    container_name: cga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: GuizadaAliaga
    ports:
      # 5433 en el host para no chocar con un Postgres local ya corriendo en 5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GuizadaAliaga"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: cga-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      # Pisa el DATABASE_URL de api/.env (que apunta a localhost, para el
      # workflow sin Docker) — dentro de la red de Docker la base se resuelve
      # por nombre de servicio, no por localhost.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/GuizadaAliaga?schema=public
      PORT: 2999
      # Mismo motivo que DATABASE_URL: dentro de Docker el frontend se sirve
      # desde el host, en localhost:4200 (mapeado desde el contenedor), así
      # que el origen sigue siendo ese aunque la API corra en otro contenedor.
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "2999:2999"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cga-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  sonarqube-db:
    image: postgres:16-alpine
    container_name: cga-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: cga-sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      # Bind a 127.0.0.1 a propósito — Sonar nunca debe quedar expuesto más
      # allá de esta máquina (ver CLAUDE.md, decisión de la épica CLI-72).
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    depends_on:
      sonarqube-db:
        condition: service_healthy

volumes:
  db_data:
    # Nombre fijo (no derivado del directorio del worktree) para que la base
    # de datos se comparta entre todos los worktrees en vez de arrancar
    # vacía en cada uno. Solo un worktree corre el stack a la vez (ver
    # container_name fijos de arriba), así que compartir el volumen es
    # seguro y evita reseedear a mano cada vez.
    name: cga_db_data
  api_node_modules:
  frontend_node_modules:
  sonarqube_db_data:
    name: cga_sonarqube_db_data
  sonarqube_data:
    name: cga_sonarqube_data
  sonarqube_extensions:
    name: cga_sonarqube_extensions
  sonarqube_logs:
    name: cga_sonarqube_logs
